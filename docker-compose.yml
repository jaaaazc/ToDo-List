services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1"]

  backend1:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=4000
    depends_on:
      - redis

  backend2:
    build: ./backend
    ports:
      - "4001:4000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=4000
    depends_on:
      - redis

  frontend1:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend1

  frontend2:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4001
    ports:
      - "5174:5173"
    depends_on:
      - backend2

volumes:
  redis-data: